---
- name: Remove Docker and Docker Compose
  become: true
  ansible.builtin.apt:
    name:
      - docker.io
      - docker-compose
      - docker-compose-v2
      - docker-doc
      - podman-docker
      - containerd
      - runc
      - docker-ce
      - docker-ce-cli
      - docker-ce-rootless-extras
      - docker-buildx-plugin
      - docker-compose-plugin
      - containerd.io
    state: absent
